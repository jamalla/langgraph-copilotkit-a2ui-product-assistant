[project]
name = "mcp-products"
version = "0.1.0"
description = "MCP server exposing the product catalog as agent tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_products"]

[tool.uv]
package = true
